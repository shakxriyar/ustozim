<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onajonimga</title>
    <style>
        body {
            margin: 0;
            /* Pushti va qora uyg'unlashgan chiroyli gradient orqa fon */
            background: linear-gradient(135deg, #1a000d 0%, #33001a 50%, #4d0026 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi emojilar konteyneri */
        .bg-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 24px;
            animation: floatUp 6s infinite linear;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        #heartCanvas {
            display: block;
            z-index: 2;
        }

        .dedication {
            position: absolute;
            bottom: 30px;
            text-align: center;
            color: #ffb6c1;
            text-shadow: 0 0 15px rgba(255, 105, 180, 0.8);
            animation: fadeIn 3s ease-in-out;
            pointer-events: none;
            width: 100%;
            z-index: 3;
        }
        .dedication h2 {
            margin: 0;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
        }
        .dedication p {
            margin: 6px 0 0 0;
            font-size: 15px;
            color: #ffc0cb;
            font-style: italic;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Orqa fondagi 💋 va boshqa emojilar -->
    <div class="bg-emojis" id="emojiContainer"></div>

    <canvas id="heartCanvas"></canvas>
    
    <div class="dedication">
        <h2>Sizni yaxshi ko'raman Onajonim</h2>
        <p>Hurmat bilan, o'g'lingiz Shahriyor</p>
    </div>

    <script>
        // Orqa fonga 💋 va yurak emojilarini chiqarish uchun skript
        const emojiContainer = document.getElementById('emojiContainer');
        const emojisList = ['💋', '💖', '❤️', '🌹', '✨', '💋'];

        function createFloatingEmoji() {
            const span = document.createElement('span');
            span.classList.add('floating-emoji');
            span.innerHTML = emojisList[Math.floor(Math.random() * emojisList.length)];
            
            // Tasodifiy joylashuv va tezlik
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 3 + 4) + 's'; // 4-7 sekund
            span.style.fontSize = (Math.random() * 15 + 18) + 'px';
            
            emojiContainer.appendChild(span);

            // Animatsiya tugagach elementni o'chirish
            setTimeout(() => {
                span.remove();
            }, 7000);
        }

        // Har 400 millisekundda yangi emoji chiqarish
        setInterval(createFloatingEmoji, 400);


        // Canvas Yurak Animatsiyasi
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resizeCanvas();
        const centerX = canvas.width / 2;
        const centerY = (canvas.height / 2) - 30; 

        let currentScale = 11; 
        const maxScale = 17;
        let currentAngleIndex = 0; 
        const pointsPerRevolution = 120; 
        const pointsPerFrame = 1; 

        function drawNextPoint() {
            for (let k = 0; k < pointsPerFrame; k++) {
                if (currentScale >= maxScale) {
                    return; 
                }

                let angle = currentAngleIndex * (Math.PI * 2) / pointsPerRevolution;

                let x = 16 * Math.pow(Math.sin(angle), 3) * currentScale;
                let y = -1 * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * currentScale;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.font = "bold 9px Arial";
                ctx.fillStyle = "#ffb6c1";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("I love you", x, y);
                ctx.restore();

                currentAngleIndex++;

                if (currentAngleIndex >= pointsPerRevolution) {
                    currentScale += 1;
                    currentAngleIndex = 0;
                }
            }

            requestAnimationFrame(drawNextPoint);
        }

        // Orqa fonni tozalash o'rniga shaffof qoldiramiz yoki gradient ustiga chizamiz
        setTimeout(() => {
            drawNextPoint();
        }, 500);

        window.addEventListener('resize', () => {
            let tempCanvas = document.createElement('canvas');
            tempCanvas.width = canvas.width;
            tempCanvas.height = canvas.height;
            tempCanvas.getContext('2d').drawImage(canvas, 0, 0);

            resizeCanvas();
            ctx.drawImage(tempCanvas, 0, 0);
        });
    </script>

</body>
</html>
