<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onajonimga - Tug'ilgan Kuningiz Muborak!</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #1a000d 0%, #33001a 50%, #4d0026 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi emojilar */
        .bg-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 22px;
            animation: floatUp 6s infinite linear;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Mobil uchun yuqoridagi qism (She'r) */
        .left-poem {
            position: relative;
            z-index: 4;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(5px);
            box-shadow: 0 0 15px rgba(255, 105, 180, 0.3);
            animation: fadeIn 2s ease-in-out;
            width: 90%;
            max-width: 350px;
            margin-top: 15px;
            text-align: center;
        }

        .left-poem h3 {
            margin: 0 0 5px 0;
            color: #ffb6c1;
            font-size: 16px;
        }

        .left-poem p {
            margin: 0;
            font-size: 13px;
            line-height: 1.4;
            font-style: italic;
            color: #ffc0cb;
        }

        #heartCanvas {
            display: block;
            z-index: 2;
            flex-grow: 1;
        }

        /* Pastdagi tabrik qismi */
        .dedication {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            animation: fadeIn 3s ease-in-out;
            width: 100%;
            padding: 10px 15px 20px 15px;
            background: linear-gradient(to top, rgba(26,0,13,0.9), transparent);
        }
        .dedication h2 {
            margin: 0 0 3px 0;
            font-size: 17px;
            font-weight: 600;
        }
        .dedication .sub-title {
            font-size: 15px;
            color: #ffb6c1;
            margin-bottom: 3px;
        }
        .dedication p {
            margin: 0;
            font-size: 13px;
            color: #ffc0cb;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- Orqa fondagi 💋 va boshqa emojilar -->
    <div class="bg-emojis" id="emojiContainer"></div>

    <!-- Telefonga moslashgan she'r bloki (yuqoriga qo'yildi) -->
    <div class="left-poem">
        <h3>Onajonim</h3>
        <p>
            Olamda yagona oftobim, o'zing,<br>
            Mehri daryo, nur sochgan yulduzim.<br>
            Tug'ilgan kuningiz muborak bo'lsin, 💋
        </p>
    </div>
    <canvas id="heartCanvas"></canvas>
    
    <div class="dedication">
        <h2>7-Avgust Onajonimning Tug'ilgan Kunlari! 🌹</h2>
        <div class="sub-title">Sizni yaxshi ko'raman Onajonim</div>
        <p>Hurmat bilan, o'g'lingiz Shahriyor</p>
    </div>

    <!-- Fon qo'shig'i (Audio) -->
    <audio id="bgMusic" autoplay loop>
        <source src="https://cdns.freemusicarchive.org/storage/freemusicarchive/music/ccCommunity/KieLoBot/First_Snow/KieLoBot_-_01_-_A_Gentle_Breeze.mp3" type="audio/mp3">
    </audio>

    <script>
        // Mobil brauzerlarda ovoz avtomatik ochilishi uchun ekranga tekkanda ishga tushadi
        document.body.addEventListener('click', () => {
            const music = document.getElementById('bgMusic');
            if (music.paused) {
                music.play();
            }
        }, { once: true });

        // Orqa fonga 💋 va yurak emojilarini chiqarish
        const emojiContainer = document.getElementById('emojiContainer');
        const emojisList = ['💋', '💖', '❤️', '🌹', '✨', '💋'];

        function createFloatingEmoji() {
            const span = document.createElement('span');
            span.classList.add('floating-emoji');
            span.innerHTML = emojisList[Math.floor(Math.random() * emojisList.length)];
            
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 3 + 4) + 's';
            span.style.fontSize = (Math.random() * 10 + 18) + 'px';
            
            emojiContainer.appendChild(span);

            setTimeout(() => {
                span.remove();
            }, 7000);
        }

        setInterval(createFloatingEmoji, 450);

        // Canvas Yurak Animatsiyasi
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight * 0.5; // Mobil ekranga qarab o'lcham
        }
        resizeCanvas();

        let currentScale = 10; 
        const maxScale = 14; // Telefon ekraniga sig'ishi uchun scale biroz kichiklashtirildi
        let currentAngleIndex = 0; 
        const pointsPerRevolution = 120; 
        const pointsPerFrame = 1; 

        function drawNextPoint() {
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;

            for (let k = 0; k < pointsPerFrame; k++) {
                if (currentScale >= maxScale) {
                    return; 
                }

                let angle = currentAngleIndex * (Math.PI * 2) / pointsPerRevolution;

                let x = 16 * Math.pow(Math.sin(angle), 3) * currentScale;
                let y = -1 * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * currentScale;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.font = "bold 8px Arial";
                ctx.fillStyle = "#ffb6c1";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("I love you", x, y);
                ctx.restore();

                currentAngleIndex++;

                if (currentAngleIndex >= pointsPerRevolution) {
                    currentScale += 1;
                    currentAngleIndex = 0;
                }
            }

            requestAnimationFrame(drawNextPoint);
        }

        setTimeout(() => {
            drawNextPoint();
        }, 500);

        window.addEventListener('resize', () => {
            resizeCanvas();
        });
    </script>

</body>
</html>
