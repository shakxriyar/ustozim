<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Onajonimga - Tug'ilgan Kuningiz Muborak!</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(135deg, #1a000d 0%, #33001a 50%, #4d0026 100%);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            position: relative;
        }

        /* Orqa fondagi harakatlanuvchi emojilar */
        .bg-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .floating-emoji {
            position: absolute;
            bottom: -50px;
            font-size: 20px;
            animation: floatUp 6s infinite linear;
            opacity: 0.6;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }

        /* Musiqani yoqish uchun tugma */
        .music-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            z-index: 10;
            background: rgba(255, 105, 180, 0.3);
            border: 1px solid #ffb6c1;
            color: #ffb6c1;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            backdrop-filter: blur(5px);
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 105, 180, 0.4);
        }

        /* Yuqoridagi she'r qismi */
        .top-poem {
            position: relative;
            z-index: 4;
            background: rgba(0, 0, 0, 0.4);
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 182, 193, 0.3);
            backdrop-filter: blur(5px);
            width: 92%;
            max-width: 340px;
            margin-top: 40px; /* Tugma bilan ustma-ust tushmasligi uchun */
            text-align: center;
        }

        .top-poem h3 {
            margin: 0 0 2px 0;
            color: #ffb6c1;
            font-size: 14px;
        }

        .top-poem p {
            margin: 0;
            font-size: 12px;
            line-height: 1.3;
            font-style: italic;
            color: #ffc0cb;
        }

        /* O'rtadagi Canvas (Yurak uchun) */
        .canvas-container {
            position: relative;
            z-index: 2;
            width: 100%;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #heartCanvas {
            display: block;
        }

        /* Pastdagi tabrik qismi */
        .dedication {
            position: relative;
            z-index: 3;
            text-align: center;
            color: #ffb6c1;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.8);
            width: 100%;
            padding: 8px 10px 15px 10px;
            background: linear-gradient(to top, rgba(26,0,13,0.95), transparent);
        }
        .dedication h2 {
            margin: 0 0 2px 0;
            font-size: 15px;
            font-weight: 600;
        }
        .dedication .sub-title {
            font-size: 13px;
            color: #ffb6c1;
            margin-bottom: 2px;
        }
        .dedication p {
            margin: 0;
            font-size: 11px;
            color: #ffc0cb;
        }
    </style>
</head>
<body>
    <!-- Musiqani yoqish tugmasi -->
    <button class="music-btn" id="musicBtn">🎵 Musiqani yoqish</button>

    <!-- Orqa fondagi 💋 va boshqa emojilar -->
    <div class="bg-emojis" id="emojiContainer"></div>

    <!-- Telefonga moslashgan ixcham she'r -->
    <div class="top-poem">
        <h3>Onajonim</h3>
        <p>
            Olamda yagona oftobim, o'zing, Mehri daryo, nur sochgan yulduzim.<br>
            Tug'ilgan kuningiz muborak bo'lsin! 💋
        </p>
    </div>

    <!-- Yurak chiqadigan joy -->
    <div class="canvas-container">
        <canvas id="heartCanvas"></canvas>
    </div>
    
    <div class="dedication">
        <h2>7-Avgust Onajonimning Tug'ilgan Kunlari! 🌹</h2>
        <div class="sub-title">Sizni yaxshi ko'raman Onajonim</div>
        <p>Hurmat bilan, o'g'lingiz Shahriyor</p>
    </div>

    <!-- Fon qo'shig'i (Audio) -->
    <audio id="bgMusic" loop>
        <source src="https://cdns.freemusicarchive.org/storage/freemusicarchive/music/ccCommunity/KieLoBot/First_Snow/KieLoBot_-_01_-_A_Gentle_Breeze.mp3" type="audio/mp3">
    </audio>

    <script>
        const music = document.getElementById('bgMusic');
        const musicBtn = document.getElementById('musicBtn');

        // Tugmani bosganda yoki ekranga tekkanda musiqa yangraydi
        function playMusic() {
            music.play().then(() => {
                musicBtn.style.display = 'none'; // Musiqa yoqilgach tugmani yashirish
            }).catch(e => {
                console.log("Audio play error:", e);
            });
        }

        musicBtn.addEventListener('click', playMusic);
        document.body.addEventListener('click', () => {
            if (music.paused) {
                playMusic();
            }
        }, { once: true });

        // Orqa fonga emojilar chiqarish
        const emojiContainer = document.getElementById('emojiContainer');
        const emojisList = ['💋', '💖', '❤️', '🌹', '✨', '💋'];

        function createFloatingEmoji() {
            const span = document.createElement('span');
            span.classList.add('floating-emoji');
            span.innerHTML = emojisList[Math.floor(Math.random() * emojisList.length)];
            
            span.style.left = Math.random() * 100 + 'vw';
            span.style.animationDuration = (Math.random() * 3 + 4) + 's';
            span.style.fontSize = (Math.random() * 8 + 16) + 'px';
            
            emojiContainer.appendChild(span);

            setTimeout(() => {
                span.remove();
            }, 7000);
        }

        setInterval(createFloatingEmoji, 500);

        // Telefon ekraniga mukammal moslashuvchi Canvas Yurak Animatsiyasi
        const canvas = document.getElementById("heartCanvas");
        const ctx = canvas.getContext("2d");

        function setupCanvasSize() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        setupCanvasSize();

        let currentScale = 9; 
        const maxScale = 13; 
        let currentAngleIndex = 0; 
        const pointsPerRevolution = 120; 
        const pointsPerFrame = 1; 

        function drawNextPoint() {
            let centerX = canvas.width / 2;
            let centerY = canvas.height / 2;

            for (let k = 0; k < pointsPerFrame; k++) {
                if (currentScale >= maxScale) {
                    return; 
                }

                let angle = currentAngleIndex * (Math.PI * 2) / pointsPerRevolution;

                let x = 16 * Math.pow(Math.sin(angle), 3) * currentScale;
                let y = -1 * (13 * Math.cos(angle) - 5 * Math.cos(2 * angle) - 2 * Math.cos(3 * angle) - Math.cos(4 * angle)) * currentScale;

                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.font = "bold 7px Arial";
                ctx.fillStyle = "#ffb6c1";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.fillText("I love you", x, y);
                ctx.restore();
                currentAngleIndex++;

                if (currentAngleIndex >= pointsPerRevolution) {
                    currentScale += 1;
                    currentAngleIndex = 0;
                }
            }

            requestAnimationFrame(drawNextPoint);
        }

        setTimeout(() => {
            drawNextPoint();
        }, 500);

        window.addEventListener('resize', () => {
            setupCanvasSize();
        });
    </script>

</body>
</html>
